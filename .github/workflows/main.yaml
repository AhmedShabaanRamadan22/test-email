name: Email Failure Test

on:
  push:
    branches:
    - main

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Dummy step
      run: echo "Everything is fine... for now "

    - name: Force Failure (Test)
      run: |
        echo "Forcing failure to test email notification"
        exit 1

    - name: Send Email on Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}

        subject: 🚨 Test CI Failed - ${{ github.repository }}

        to: ${{ secrets.EMAIL_TO }}
        from: GitHub Actions <${{ secrets.EMAIL_FROM }}>

        body: |
          This is a test email 🚀

          The GitHub Actions workflow failed intentionally.

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Workflow: ${{ github.workflow }}
          Job: ${{ github.job }}
          Triggered by: ${{ github.actor }}

          Logs:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}



 
     notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: ${{ failure() }}  # Trigger only on failure

    steps:
      - name: Fetch Gmail credentials from AWS Secret Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: github-actions
          parse-json-secrets: true

      - name: Send email via Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: GitHub Actions Failure Notification
          to: your-email@gmail.com
          body: |
            Workflow run failed!
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Run ID: ${{ github.run_id }}
